; PlatformIO 專案設定檔
; ESP32-C3 Grove Vision AI V2 Forwarder

[platformio]
; 原始碼目錄設定（使用根目錄而非預設的 src）
src_dir = .

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; 上傳設定
upload_speed = 921600
monitor_speed = 115200

; 函式庫依賴
; 注意：不使用 SSCMA 庫，因為 tflm_yolov8_pose_reid 會直接輸出 JSON
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0

; 建置選項
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

; 檔案系統設定 (LittleFS)
board_build.filesystem = littlefs

; 分區表 (需要包含 spiffs/littlefs 分區)
board_build.partitions = default.csv

; 監控設定
monitor_filters = 
    esp32_exception_decoder
    time
